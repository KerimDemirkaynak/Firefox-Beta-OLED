name: Build Firefox Beta OLED (Test Mode)

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # 1. Aşama: Sadece Sürümü Al (Eski Sürümle Karşılaştırma Yok)
  get_version:
    runs-on: ubuntu-latest
    outputs:
      FENIX_VERSION: ${{ steps.get_upstream_release.outputs.FENIX_VERSION }}
    steps:
      - name: Get Latest Firefox Beta Release (Upstream)
        id: get_upstream_release
        run: |
          # Mozilla'dan en son sürüm numarasını çekiyoruz
          FENIX_VERSION=$(curl -s https://ftp.mozilla.org/pub/fenix/releases/ | grep -oE '[0-9]+\.[0-9]+b[0-9]+' | sort -V | tail -n 1)
          echo "FENIX_VERSION=$FENIX_VERSION" >> $GITHUB_OUTPUT
          echo "Current upstream Firefox Beta version: $FENIX_VERSION"

  # 2. Aşama: İlgili Mimariler İçin Paralel Derleme (Matrix) - Şartsız Çalışır
  build:
    needs: get_version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y wget apktool zipalign apksigner jq openjdk-17-jdk
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Latest APK for ${{ matrix.arch }}
        run: |
          FENIX_VERSION="${{ needs.get_version.outputs.FENIX_VERSION }}"
          BASE_URL="https://ftp.mozilla.org/pub/fenix/releases/${FENIX_VERSION}/android/fenix-${FENIX_VERSION}-android-${{ matrix.arch }}/"
          
          # Dizin içindeki tam .apk dosya adını bul
          APK_NAME=$(curl -s "$BASE_URL" | grep -oE 'fenix-[^/"]+\.apk' | head -n 1)
          
          if [ -z "$APK_NAME" ]; then
            APK_NAME="fenix-${FENIX_VERSION}-android-${{ matrix.arch }}.apk"
          fi

          DOWNLOAD_URL="${BASE_URL}${APK_NAME}"
          echo "Downloading from: $DOWNLOAD_URL"
          wget -q "$DOWNLOAD_URL" -O fenix.apk

      - name: Run Build Script
        run: bash build.sh
        
      - name: Sign & Rename APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Keystore GitHub Secrets üzerinden çözülüyor..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.keystore
          
          echo "APK kendi şifrelerimizle imzalanıyor..."
          apksigner sign --ks release-key.keystore --ks-pass pass:"$STORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" fenix-patched-signed.apk
          
          # APK'yı mimari ismini içerecek şekilde yeniden adlandır
          FINAL_APK_NAME="fenix-oled-${{ needs.get_version.outputs.FENIX_VERSION }}-${{ matrix.arch }}.apk"
          mv fenix-patched-signed.apk "$FINAL_APK_NAME"
          
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-beta-oled-${{ matrix.arch }}
          path: fenix-oled-*.apk

  # 3. Aşama: Çıktıları Birleştirip Sürüm (Release) Oluşturma
  release:
    needs: [get_version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firefox-beta-oled-*
          path: apks
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Testler çakışmasın diye sonuna derleme numarası (run_number) ekledik
          tag_name: ${{ needs.get_version.outputs.FENIX_VERSION }}-test-${{ github.run_number }}
          name: Firefox Beta OLED Theme ${{ needs.get_version.outputs.FENIX_VERSION }} (TEST)
          body: |
            TEST RELEASE: Automatic release of Firefox Beta OLED Theme based on upstream version ${{ needs.get_version.outputs.FENIX_VERSION }}.
            
            **Desteklenen Mimariler (Supported Architectures):**
            * `arm64-v8a` (Modern cihazların çoğu)
            * `armeabi-v7a` (Eski nesil/32-bit cihazlar)
            * `x86_64` (Emülatörler ve x86 tabletler)
          files: apks/*.apk

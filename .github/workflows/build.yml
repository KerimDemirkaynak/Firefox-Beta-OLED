name: Build Firefox Beta OLED Theme (Auto-Release)

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Stage 1: Version Check
  check_version:
    runs-on: ubuntu-latest
    outputs:
      NEW_VERSION_AVAILABLE: ${{ steps.version_check.outputs.NEW_VERSION_AVAILABLE }}
      FENIX_VERSION: ${{ steps.get_upstream_release.outputs.FENIX_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest Firefox Beta Release (Upstream)
        id: get_upstream_release
        run: |
          FENIX_VERSION=$(curl -s https://ftp.mozilla.org/pub/fenix/releases/ | grep -oE '[0-9]+\.[0-9]+b[0-9]+' | sort -V | tail -n 1)
          echo "FENIX_VERSION=$FENIX_VERSION" >> $GITHUB_OUTPUT
          echo "Current upstream Firefox Beta version: $FENIX_VERSION"

      - name: Check if release already exists in this repo
        id: version_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_VERSION="${{ steps.get_upstream_release.outputs.FENIX_VERSION }}"
          
          # GitHub'ın kendi CLI aracıyla bu sürüme ait bir release var mı kontrol ediyoruz
          if gh release view "$UPSTREAM_VERSION" >/dev/null 2>&1; then
            echo "NEW_VERSION_AVAILABLE=false" >> $GITHUB_OUTPUT
            echo "Release $UPSTREAM_VERSION already exists in your repo. Skipping build."
          else
            echo "NEW_VERSION_AVAILABLE=true" >> $GITHUB_OUTPUT
            echo "Release $UPSTREAM_VERSION not found! Proceeding to build phase."
          fi

  # Stage 2: Parallel Build for Architectures (Matrix)
  build:
    needs: check_version
    if: needs.check_version.outputs.NEW_VERSION_AVAILABLE == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y wget apktool zipalign apksigner jq openjdk-17-jdk
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Latest APK for ${{ matrix.arch }}
        run: |
          FENIX_VERSION="${{ needs.check_version.outputs.FENIX_VERSION }}"
          BASE_URL="https://ftp.mozilla.org/pub/fenix/releases/${FENIX_VERSION}/android/fenix-${FENIX_VERSION}-android-${{ matrix.arch }}/"
          
          # Dizin içindeki tam .apk dosya adını bul
          APK_NAME=$(curl -s "$BASE_URL" | grep -oE 'fenix-[^/"]+\.apk' | head -n 1)
          
          if [ -z "$APK_NAME" ]; then
            APK_NAME="fenix-${FENIX_VERSION}-android-${{ matrix.arch }}.apk"
          fi

          DOWNLOAD_URL="${BASE_URL}${APK_NAME}"
          echo "Downloading from: $DOWNLOAD_URL"
          wget -q "$DOWNLOAD_URL" -O fenix.apk

      - name: Run Build Script
        run: bash build.sh
        
      - name: Sign & Rename APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Keystore GitHub Secrets üzerinden çözülüyor..."
          echo "$KEYSTORE_BASE64" | base64 --decode > release-key.keystore
          
          echo "APK kendi şifrelerimizle imzalanıyor..."
          apksigner sign --ks release-key.keystore --ks-pass pass:"$STORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" fenix-patched-signed.apk
          
          # APK'yı mimari ismini içerecek şekilde yeniden adlandır
          FINAL_APK_NAME="fenix-oled-${{ needs.check_version.outputs.FENIX_VERSION }}-${{ matrix.arch }}.apk"
          mv fenix-patched-signed.apk "$FINAL_APK_NAME"
          
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-beta-oled-${{ matrix.arch }}
          path: fenix-oled-*.apk

  # Stage 3: Merge Outputs and Create Release
  release:
    needs: [check_version, build]
    if: needs.check_version.outputs.NEW_VERSION_AVAILABLE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firefox-beta-oled-*
          path: apks
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check_version.outputs.FENIX_VERSION }}
          name: Firefox Beta OLED Theme ${{ needs.check_version.outputs.FENIX_VERSION }}
          body: |
            Automatic release of Firefox Beta OLED Theme based on upstream version ${{ needs.check_version.outputs.FENIX_VERSION }}.
            
            This APK is automatically built and patched for an AMOLED dark theme.
            
            **Supported Architectures:**
            * `arm64-v8a` (Most modern devices)
            * `armeabi-v7a` (Older/32-bit devices)
            * `x86_64` (Emulators and x86 tablets)
          files: apks/*.apk
